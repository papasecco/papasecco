<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palestra Test d'Ingresso</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap');

/* ---- Tema ----
   Palette: carta calda + inchiostro blu. Caratteri: Newsreader per i titoli,
   Atkinson Hyperlegible (disegnato per la leggibilità) per testo e domande. */
:root{
  --bg:#f6f5f1; --sfondo-card:#fffefb; --testo:#1a1c22; --testo-tenue:#5b6070;
  --bordo:#e4e1d8; --bordo-forte:#cac6bb; --acc:#2b4bb8; --acc-tenue:#e9edfb;
  --ok:#1a7f4b; --ok-tenue:#e3f5ec; --ko:#c02b3a; --ko-tenue:#fdeaec;
  --avviso:#8a6100; --avviso-tenue:#fdf3dd; --ombra:0 1px 2px rgba(16,20,28,.06),0 6px 20px rgba(16,20,28,.06);
  --r:14px;
}
:root[data-tema="scuro"]{
  --bg:#12141a; --sfondo-card:#191c24; --testo:#e8eaf0; --testo-tenue:#99a0b0;
  --bordo:#272b35; --bordo-forte:#3a4050; --acc:#8aa5ff; --acc-tenue:#1c2542;
  --ok:#5fd39a; --ok-tenue:#123227; --ko:#ff8892; --ko-tenue:#3a1a20;
  --avviso:#e5b95b; --avviso-tenue:#332910; --ombra:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--testo);
  font:16px/1.6 "Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
h1{font-family:Newsreader,"Iowan Old Style",Georgia,serif;font-weight:500;font-size:1.9rem;letter-spacing:-.01em;
   text-wrap:balance;margin:.15em 0 .3em}
h2,.card-t,.mappa summary,.riepilogo h2{font-family:Newsreader,"Iowan Old Style",Georgia,serif;font-weight:600;letter-spacing:-.005em}
.sub{color:var(--testo-tenue);margin:0 0 1.5rem;max-width:62ch}

/* ---- Header ---- */
.top{border-bottom:1px solid var(--bordo);background:var(--sfondo-card);position:sticky;top:0;z-index:20}
.top-in{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{background:none;border:0;font:inherit;font-family:Newsreader,Georgia,serif;font-size:1.08rem;font-weight:600;color:var(--testo);cursor:pointer;padding:6px 8px;border-radius:10px}
.logo:hover{background:var(--bg)}
.top-nav{display:flex;gap:6px}

/* ---- Bottoni ---- */
button{font:inherit}
.primary{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;font-weight:600}
.primary:hover{filter:brightness(1.08)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.primary.big{width:100%;padding:14px;font-size:1.05rem;margin-top:8px}
.ghost{background:var(--sfondo-card);color:var(--testo);border:1px solid var(--bordo-forte);border-radius:10px;padding:10px 14px;cursor:pointer}
.ghost:hover{border-color:var(--acc);color:var(--acc)}
.ghost.icon{width:38px;padding:0;height:38px}
.ghost.attivo{background:var(--acc-tenue);border-color:var(--acc);color:var(--acc)}
.danger{color:var(--ko);border-color:var(--ko)}
.danger:hover{background:var(--ko-tenue);color:var(--ko);border-color:var(--ko)}
.link{background:none;border:0;color:var(--acc);cursor:pointer;padding:6px 0;font:inherit}
.back{display:inline-block;margin:14px 0 4px}

/* ---- Home ---- */
.view{padding:20px 0 60px}
.cards{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.cards{grid-template-columns:repeat(3,1fr)}}
.card{
  display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;
  background:var(--sfondo-card);border:1px solid var(--bordo);border-radius:var(--r);
  padding:18px;box-shadow:var(--ombra);color:inherit;font:inherit;transition:border-color .15s,transform .15s
}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card-ico{font-size:1.5rem}
.card-t{font-size:1.12rem}
.card-d{color:var(--testo-tenue);font-size:.9rem;line-height:1.45}

.riepilogo{margin-top:26px}
.riepilogo .box{background:var(--sfondo-card);border:1px solid var(--bordo);border-radius:var(--r);padding:16px 18px;box-shadow:var(--ombra)}
.riepilogo h2{font-size:1rem;margin:0 0 10px}
.mini{display:flex;gap:22px;flex-wrap:wrap}
.mini div{display:flex;flex-direction:column}
.mini b{font-family:Newsreader,Georgia,serif;font-size:1.7rem;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.mini span{color:var(--testo-tenue);font-size:.82rem}
.avviso{background:var(--avviso-tenue);border:1px solid var(--avviso);color:var(--avviso);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.avviso b{color:var(--testo)}
.avviso button{margin-top:8px}

/* ---- Form ---- */
.form{background:var(--sfondo-card);border:1px solid var(--bordo);border-radius:var(--r);padding:20px;box-shadow:var(--ombra);display:flex;flex-direction:column;gap:16px}
.campo{display:flex;flex-direction:column;gap:6px}
.lab{font-weight:600;font-size:.9rem}
.hint{color:var(--testo-tenue);font-size:.82rem}
select,input[type=number]{
  background:var(--bg);color:var(--testo);border:1px solid var(--bordo-forte);
  border-radius:10px;padding:10px 12px;font:inherit;width:100%
}
.riga{display:flex;gap:14px;flex-wrap:wrap}
.riga>*{flex:1 1 180px}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--bordo-forte);background:var(--bg);color:var(--testo);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed=true]{background:var(--acc-tenue);border-color:var(--acc);color:var(--acc);font-weight:600}
.punteggio{font-size:.85rem;color:var(--testo-tenue);background:var(--bg);border-radius:10px;padding:10px 12px}
.err{color:var(--ko);margin:0;font-size:.9rem}

/* ---- Quiz ---- */
.quiz-bar{position:sticky;top:56px;background:var(--bg);padding:14px 0 10px;z-index:10}
.q-progress{height:6px;background:var(--bordo);border-radius:99px;overflow:hidden}
#q-progress-fill{height:100%;width:0;background:var(--acc);transition:width .2s}
.quiz-meta{font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.86rem;color:var(--testo-tenue)}
.tag{background:var(--acc-tenue);color:var(--acc);border-radius:999px;padding:3px 10px;font-weight:600}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:650;color:var(--testo)}
.timer.rosso{color:var(--ko)}
.domanda{background:var(--sfondo-card);border:1px solid var(--bordo);border-radius:var(--r);padding:22px;box-shadow:var(--ombra)}
.q-testo{font-size:1.1rem;line-height:1.65;margin:0 0 20px;white-space:pre-wrap;max-width:64ch}
.opzioni{display:flex;flex-direction:column;gap:10px}
.opz{
  display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--bg);border:1.5px solid var(--bordo-forte);border-radius:12px;
  padding:13px 15px;cursor:pointer;color:inherit;font:inherit;transition:border-color .12s,background .12s
}
.opz:hover{border-color:var(--acc)}
.opz .lettera{
  flex:0 0 26px;height:26px;border-radius:8px;background:var(--sfondo-card);border:1px solid var(--bordo-forte);
  display:grid;place-items:center;font-weight:700;font-size:.85rem
}
.opz.scelta{border-color:var(--acc);background:var(--acc-tenue)}
.opz.scelta .lettera{background:var(--acc);color:#fff;border-color:var(--acc)}
.opz.giusta{border-color:var(--ok);background:var(--ok-tenue)}
.opz.giusta .lettera{background:var(--ok);color:#fff;border-color:var(--ok)}
.opz.sbagliata{border-color:var(--ko);background:var(--ko-tenue)}
.opz.sbagliata .lettera{background:var(--ko);color:#fff;border-color:var(--ko)}
.opz:disabled{cursor:default}
.feedback{margin-top:18px;padding:14px 16px;border-radius:12px;font-size:.95rem;line-height:1.5}
.feedback.ok{background:var(--ok-tenue);border:1px solid var(--ok)}
.feedback.ko{background:var(--ko-tenue);border:1px solid var(--ko)}
.feedback b{display:block;margin-bottom:4px}
.feedback .fonte{display:block;margin-top:8px;font-size:.82rem;color:var(--testo-tenue)}
.quiz-azioni{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.quiz-azioni .primary{margin-left:auto}
#q-segna.attivo{background:var(--acc-tenue);border-color:var(--acc);color:var(--acc)}

.mappa{margin-top:22px;background:var(--sfondo-card);border:1px solid var(--bordo);border-radius:var(--r);padding:14px 18px}
.mappa summary{cursor:pointer;font-weight:600}
.mappa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px;margin:14px 0}
.cella{aspect-ratio:1;border-radius:9px;border:1.5px solid var(--bordo-forte);background:var(--bg);color:var(--testo);cursor:pointer;font-size:.82rem;font-weight:600}
.cella.risposta{background:var(--acc-tenue);border-color:var(--acc);color:var(--acc)}
.cella.segnata{border-color:var(--avviso);border-width:2.5px}
.cella.corrente{outline:2px solid var(--testo);outline-offset:1px}

/* ---- Risultati ---- */
.sintesi{background:var(--sfondo-card);border:1px solid var(--bordo);border-radius:var(--r);padding:24px;box-shadow:var(--ombra);text-align:center}
.sintesi .voto{font-family:Newsreader,Georgia,serif;font-size:3.2rem;font-weight:500;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.sintesi .esito{font-weight:650;margin-top:4px}
.sintesi .esito.ok{color:var(--ok)}
.sintesi .esito.ko{color:var(--ko)}
.sintesi .dati{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin-top:18px;color:var(--testo-tenue);font-size:.9rem}
.sintesi .dati b{display:block;color:var(--testo);font-size:1.15rem;font-variant-numeric:tabular-nums}
.barre{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.barra{background:var(--sfondo-card);border:1px solid var(--bordo);border-radius:12px;padding:12px 16px}
.barra .testa{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:8px}
.barra .traccia{height:8px;background:var(--bordo);border-radius:99px;overflow:hidden}
.barra .riemp{height:100%;background:var(--ok)}
.barra .riemp.basso{background:var(--ko)}
.barra .riemp.medio{background:var(--avviso)}
.dettaglio{margin-top:24px;display:flex;flex-direction:column;gap:16px}
.rev{background:var(--sfondo-card);border:1px solid var(--bordo);border-left:4px solid var(--ok);border-radius:12px;padding:16px 18px}
.rev.ko{border-left-color:var(--ko)}
.rev.vuota{border-left-color:var(--bordo-forte)}
.rev .num{font-size:.8rem;color:var(--testo-tenue);text-transform:uppercase;letter-spacing:.04em}
.rev .t{margin:6px 0 10px;white-space:pre-wrap}
.rev ul{margin:0;padding-left:20px}
.rev li{margin:3px 0}
.rev li.g{color:var(--ok);font-weight:600}
.rev li.s{color:var(--ko);text-decoration:line-through}
.rev .sp{margin-top:10px;font-size:.9rem;color:var(--testo-tenue)}

/* ---- Statistiche ---- */
.tabella{width:100%;font-variant-numeric:tabular-nums;border-collapse:collapse;background:var(--sfondo-card);border:1px solid var(--bordo);border-radius:var(--r);overflow:hidden;font-size:.9rem}
.tabella th,.tabella td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--bordo)}
.tabella th{background:var(--bg);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--testo-tenue)}
.tabella tr:last-child td{border-bottom:0}
.vuoto{color:var(--testo-tenue);background:var(--sfondo-card);border:1px dashed var(--bordo-forte);border-radius:var(--r);padding:26px;text-align:center}
#v-stat h2{font-size:1rem;margin:26px 0 10px}
#s-reset{margin-top:26px}
.foot{color:var(--testo-tenue);font-size:.82rem;border-top:1px solid var(--bordo);padding-top:14px;padding-bottom:30px}

/* ---- accessibilità ---- */
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <button class="logo" id="btn-home" title="Torna alla home">📝 <span>Test d'Ingresso</span></button>
    <nav class="top-nav">
      <button class="ghost" id="nav-stat">Statistiche</button>
      <button class="ghost icon" id="nav-tema" title="Cambia tema">◐</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main">

  <!-- ===== HOME ===== -->
  <section id="v-home" class="view">
    <h1>Preparati al test</h1>
    <p class="sub">Scegli una modalità. I progressi restano salvati su questo dispositivo.</p>

    <div class="cards">
      <button class="card" data-modalita="esame">
        <span class="card-ico">⏱️</span>
        <span class="card-t">Simulazione d'esame</span>
        <span class="card-d">Prova cronometrata con punteggio, esattamente come il test vero. Nessun aiuto durante la prova.</span>
      </button>
      <button class="card" data-modalita="allenamento">
        <span class="card-ico">🎯</span>
        <span class="card-t">Allenamento per materia</span>
        <span class="card-d">Risposta corretta e spiegazione subito dopo ogni domanda. Senza tempo.</span>
      </button>
      <button class="card" data-modalita="errori">
        <span class="card-ico">🔁</span>
        <span class="card-t">Ripasso degli errori</span>
        <span class="card-d">Solo le domande sbagliate in passato, finché non diventano automatiche.</span>
      </button>
    </div>

    <div id="home-riepilogo" class="riepilogo"></div>
  </section>

  <!-- ===== SETUP ===== -->
  <section id="v-setup" class="view" hidden>
    <button class="link back" data-back>← Indietro</button>
    <h1 id="setup-titolo">Imposta la prova</h1>

    <div class="form">
      <label class="campo">
        <span class="lab">Banca dati</span>
        <select id="f-banca"></select>
        <span class="hint" id="f-banca-hint"></span>
      </label>

      <label class="campo" id="c-materie">
        <span class="lab">Materie</span>
        <div id="f-materie" class="chips"></div>
      </label>

      <div class="riga">
        <label class="campo">
          <span class="lab">Numero di domande</span>
          <input type="number" id="f-numero" min="1" step="1">
        </label>
        <label class="campo" id="c-tempo">
          <span class="lab">Tempo (minuti)</span>
          <input type="number" id="f-tempo" min="1" step="1">
        </label>
      </div>

      <div class="riga">
        <label class="check"><input type="checkbox" id="f-mesc-dom" checked> Mescola le domande</label>
        <label class="check"><input type="checkbox" id="f-mesc-opz" checked> Mescola le opzioni</label>
      </div>

      <div class="punteggio" id="f-punteggio"></div>

      <button class="primary big" id="f-avvia">Inizia la prova</button>
      <p class="err" id="f-errore" hidden></p>
    </div>
  </section>

  <!-- ===== QUIZ ===== -->
  <section id="v-quiz" class="view" hidden>
    <div class="quiz-bar">
      <div class="q-progress"><div id="q-progress-fill"></div></div>
      <div class="quiz-meta">
        <span id="q-contatore">1 / 30</span>
        <span id="q-materia" class="tag"></span>
        <span id="q-timer" class="timer"></span>
      </div>
    </div>

    <article class="domanda">
      <p id="q-testo" class="q-testo"></p>
      <div id="q-opzioni" class="opzioni"></div>
      <div id="q-feedback" class="feedback" hidden></div>
    </article>

    <div class="quiz-azioni">
      <button class="ghost" id="q-prec">← Precedente</button>
      <button class="ghost" id="q-segna">⚑ Segna</button>
      <button class="ghost" id="q-pulisci">Cancella risposta</button>
      <button class="primary" id="q-succ">Successiva →</button>
    </div>

    <details class="mappa" id="q-mappa-box">
      <summary>Mappa delle domande</summary>
      <div id="q-mappa" class="mappa-grid"></div>
      <button class="danger ghost" id="q-consegna">Consegna e correggi</button>
    </details>
  </section>

  <!-- ===== RISULTATI ===== -->
  <section id="v-risultati" class="view" hidden>
    <h1>Risultato</h1>
    <div id="r-sintesi" class="sintesi"></div>
    <div id="r-materie" class="barre"></div>
    <div class="quiz-azioni">
      <button class="primary" id="r-rivedi">Rivedi le domande</button>
      <button class="ghost" id="r-ripeti">Rifai una prova simile</button>
      <button class="ghost" id="r-home">Home</button>
    </div>
    <div id="r-dettaglio" class="dettaglio" hidden></div>
  </section>

  <!-- ===== STATISTICHE ===== -->
  <section id="v-stat" class="view" hidden>
    <button class="link back" data-back>← Indietro</button>
    <h1>Statistiche</h1>
    <div id="s-corpo"></div>
    <button class="danger ghost" id="s-reset">Azzera tutti i dati</button>
  </section>

</main>

<footer class="wrap foot">
  <p>Tutti i dati restano nel browser di chi studia. Nessun account, nessun server.</p>
</footer>

<script>
/* ============================================================================
   BANCHE DATI DELLE DOMANDE
   ----------------------------------------------------------------------------
   Ogni banca è un oggetto con questa forma (vedi domande/MODELLO.md):

   {
     id: "identificativo-univoco",
     titolo: "Nome mostrato nel menu",
     descrizione: "Riga di contesto",
     esame: {                       // regole della prova ufficiale
       durataMinuti: 60,
       numeroDomande: 30,
       puntiCorretta: 1,
       puntiErrata: 0,              // es. -0.25 se il bando prevede penalità
       puntiOmessa: 0,
       sogliaSufficienza: 18        // null se non prevista
     },
     domande: [
       {
         id: "L01",                 // univoco dentro la banca
         materia: "Logica",
         testo: "Testo della domanda",
         opzioni: ["A", "B", "C", "D"],
         corretta: 2,               // INDICE (0 = prima opzione)
         spiegazione: "Perché è quella giusta",
         fonte: "Manuale X, cap. 3" // facoltativo
       }
     ]
   }

   La banca qui sotto è un ESEMPIO DIMOSTRATIVO, da sostituire con le domande
   costruite sul programma e sui testi d'esame reali.
   ========================================================================== */

window.BANCHE = [
{
  id: "demo-generale",
  titolo: "Banca dimostrativa (logica, testo, matematica, inglese)",
  descrizione: "esempio da sostituire con le domande del test reale",
  esame: { durataMinuti: 45, numeroDomande: 30, puntiCorretta: 1, puntiErrata: 0, puntiOmessa: 0, sogliaSufficienza: 18 },
  domande: [

  /* ---------------- LOGICA ---------------- */
  { id:"LOG01", materia:"Logica", testo:"Completa la serie: 2, 6, 12, 20, 30, ?",
    opzioni:["36","40","42","44"], corretta:2,
    spiegazione:"Le differenze fra termini consecutivi sono 4, 6, 8, 10: la successiva è 12, quindi 30 + 12 = 42." },

  { id:"LOG02", materia:"Logica", testo:"Tutti i cigni del lago sono bianchi. Alcuni animali del lago non sono bianchi. Quale conclusione è necessariamente vera?",
    opzioni:["Alcuni animali del lago non sono cigni","Nessun animale del lago è un cigno","Tutti gli animali del lago sono cigni","Alcuni cigni del lago non sono bianchi"], corretta:0,
    spiegazione:"Se un animale non è bianco non può essere un cigno del lago (tutti i cigni lo sono): quindi almeno un animale del lago non è un cigno." },

  { id:"LOG03", materia:"Logica", testo:"Qual è la corretta negazione della frase «Tutti gli studenti hanno superato il test»?",
    opzioni:["Nessuno studente ha superato il test","Almeno uno studente non ha superato il test","Tutti gli studenti non hanno superato il test","Pochi studenti hanno superato il test"], corretta:1,
    spiegazione:"La negazione di un enunciato universale affermativo è un enunciato particolare negativo: basta un solo controesempio." },

  { id:"LOG04", materia:"Logica", testo:"«Se piove, Anna resta a casa». Sappiamo che Anna non è a casa. Che cosa se ne deduce?",
    opzioni:["Non piove","Piove","Anna resta a casa solo se piove","Non si può dedurre nulla"], corretta:0,
    spiegazione:"È il modus tollens: se l'antecedente implica il conseguente e il conseguente è falso, l'antecedente è falso." },

  { id:"LOG05", materia:"Logica", testo:"In una classe di 30 studenti, 18 studiano inglese, 15 studiano francese e 7 studiano entrambe le lingue. Quanti non studiano nessuna delle due?",
    opzioni:["2","4","5","7"], corretta:1,
    spiegazione:"Per il principio di inclusione-esclusione: 18 + 15 − 7 = 26 studiano almeno una lingua, quindi 30 − 26 = 4." },

  { id:"LOG06", materia:"Logica", testo:"Completa la serie di lettere, usando l'alfabeto inglese di 26 lettere: A, C, F, J, O, ?",

  { id:"COM01", materia:"Comprensione del testo",

    opzioni:["La divulgazione va riservata agli specialisti","Semplificare è sempre sbagliato","Divulgare significa rendere comprensibile il metodo, non solo la conclusione","I lettori non specialisti non possono valutare uno studio"], corretta:2,

  { id:"COM04", materia:"Comprensione del testo",

    opzioni:["È indispensabile per valutare i limiti di uno studio","Non è indispensabile se si conosce il metodo dello studio","Coincide con la conoscenza delle conclusioni","È l'unico obiettivo della divulgazione"], corretta:1,
    spiegazione:"L'ultima frase dice che il lettore che conosce il metodo può valutare i limiti «anche senza essere uno specialista»." },

  { id:"COM05", materia:"Comprensione del testo",
    testo:"Leggi il brano e rispondi.\n\n«Il lavoro da remoto ha ridotto i tempi di spostamento, ma ha reso più difficile separare l'orario di lavoro da quello privato. Le aziende che hanno introdotto regole esplicite sulla reperibilità riportano livelli di soddisfazione più alti rispetto a quelle che hanno lasciato la questione alla libera interpretazione dei singoli.»\n\nChe cosa si può concludere dal brano?",
    opzioni:["Il lavoro da remoto è complessivamente dannoso","Regole esplicite sulla reperibilità si associano a maggiore soddisfazione","Le aziende senza regole hanno tempi di spostamento più lunghi","La separazione fra lavoro e vita privata non dipende dalle regole aziendali"], corretta:1,
    spiegazione:"Il brano riporta un'associazione fra regole esplicite sulla reperibilità e soddisfazione più alta; non giudica il lavoro da remoto in sé." },

  /* ---------------- MATEMATICA E STATISTICA ---------------- */
  { id:"MAT01", materia:"Matematica e statistica", testo:"Qual è la media aritmetica dei valori 4, 8, 10, 10, 13?",
    opzioni:["8","9","10","9,5"], corretta:1,
    spiegazione:"La somma è 45 e i valori sono 5: 45 / 5 = 9." },

  { id:"MAT02", materia:"Matematica e statistica", testo:"Qual è la mediana della serie ordinata 3, 7, 9, 15, 21, 25?",
    opzioni:["9","12","15","13,3"], corretta:1,
    spiegazione:"Con un numero pari di osservazioni la mediana è la media dei due valori centrali: (9 + 15) / 2 = 12." },

  { id:"MAT03", materia:"Matematica e statistica", testo:"Se a ogni valore di una distribuzione si somma la costante 5, la deviazione standard:",
    opzioni:["Aumenta di 5","Resta invariata","Si moltiplica per 5","Diventa nulla"], corretta:1,
    spiegazione:"La deviazione standard misura la dispersione attorno alla media: una traslazione sposta media e valori della stessa quantità, lasciando invariati gli scarti." },

  { id:"MAT04", materia:"Matematica e statistica", testo:"Lanciando due dadi a sei facce, qual è la probabilità che la somma sia 7?",
    opzioni:["1/12","1/6","1/9","7/36"], corretta:1,
    spiegazione:"I casi favorevoli sono 6 su 36 esiti possibili (1-6, 2-5, 3-4, 4-3, 5-2, 6-1): 6/36 = 1/6." },

  { id:"MAT05", materia:"Matematica e statistica", testo:"Un prezzo di 200 euro aumenta del 10% e successivamente diminuisce del 10%. Qual è la variazione complessiva rispetto al prezzo iniziale?",
    opzioni:["Nessuna variazione","−1%","−2%","+1%"], corretta:1,
    spiegazione:"200 → 220 → 198. La differenza è −2 euro su 200, cioè −1%: le variazioni percentuali non si compensano perché applicate a basi diverse." },

  { id:"MAT06", materia:"Matematica e statistica", testo:"Risolvi l'equazione 3x − 7 = 2x + 5.",
    opzioni:["x = 2","x = 12","x = −12","x = 6"], corretta:1,
    spiegazione:"Portando le incognite a sinistra e i numeri a destra: 3x − 2x = 5 + 7, quindi x = 12." },

    opzioni:["4,5 giorni","7 giorni","8 giorni","9 giorni"], corretta:2,

  { id:"MAT08", materia:"Matematica e statistica", testo:"Qual è la moda della distribuzione 2, 3, 3, 5, 7, 7, 7, 9?",
    opzioni:["3","5","7","5,4"], corretta:2,
    spiegazione:"La moda è il valore con frequenza più alta: il 7 compare tre volte, più di ogni altro." },

  { id:"MAT09", materia:"Matematica e statistica", testo:"Fra due variabili il coefficiente di correlazione lineare vale −0,9. Che cosa indica?",

    opzioni:["25/64","5/14","1/2","3/14"], corretta:1,

  /* ---------------- INGLESE ---------------- */

<script>
/* Preparazione test d'ingresso — app statica, nessuna dipendenza.
   I dati delle domande arrivano da domande/banche.js (window.BANCHE). */
(() => {
"use strict";

// ---------- utilità ----------
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const LETTERE = ["A", "B", "C", "D", "E", "F"];
const CHIAVI = { sessione: "ti.sessione.v2", storico: "ti.storico.v2", errori: "ti.errori.v2", tema: "ti.tema" };

const leggi = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const scrivi = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

function mescola(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
  return b;
}
const mmss = ms => {
  const t = Math.max(0, Math.round(ms / 1000));
  const m = String(Math.floor(t / 60)).padStart(2, "0");
  return `${m}:${String(t % 60).padStart(2, "0")}`;
};
const dataIt = ts => new Date(ts).toLocaleString("it-IT", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
const arrotonda = n => Math.round(n * 100) / 100;
const segno = n => (n > 0 ? "+" : "") + n;
const plur = (n, s1, s2) => (Math.abs(n) === 1 ? s1 : s2);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- dati ----------
const BANCHE = (window.BANCHE || []).filter(b => b && Array.isArray(b.domande) && b.domande.length);
const bancaDi = id => BANCHE.find(b => b.id === id) || BANCHE[0];
const CONF_DEF = { durataMinuti: 60, numeroDomande: 30, puntiCorretta: 1, puntiErrata: 0, puntiOmessa: 0, sogliaSufficienza: null };
const confDi = b => Object.assign({}, CONF_DEF, (b && b.esame) || {});

// tutte le domande, con banca e chiave stabile
function domandeDi(banca) {
  return banca.domande.map((q, i) => Object.assign({}, q, {
    id: q.id || `${banca.id}-${i + 1}`,
    materia: q.materia || "Generale",
    _banca: banca.id
  }));
}
const chiave = q => `${q._banca}::${q.id}`;

// ---------- stato ----------
let sessione = null;      // prova in corso
let tick = null;          // timer
let ultimoEsito = null;   // per la schermata risultati
let vistaPrec = "v-home";

// ---------- tema ----------
const temaSalvato = leggi(CHIAVI.tema, null);
const temaOspite = document.documentElement.dataset.theme; // quando la pagina è ospitata altrove
const scuroDiSistema = temaOspite ? temaOspite === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
if (temaSalvato) document.documentElement.dataset.tema = temaSalvato;
else if (scuroDiSistema) document.documentElement.dataset.tema = "scuro";
$("#nav-tema").onclick = () => {
  const nuovo = document.documentElement.dataset.tema === "scuro" ? "chiaro" : "scuro";
  document.documentElement.dataset.tema = nuovo;
  scrivi(CHIAVI.tema, nuovo);
};

// ---------- navigazione ----------
function mostra(id) {
  $$(".view").forEach(v => { v.hidden = v.id !== id; });
  if (id !== "v-stat") vistaPrec = id;
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}
$("#btn-home").onclick = () => { if (confermaAbbandono()) { mostra("v-home"); disegnaHome(); } };
$("#r-home").onclick = () => { mostra("v-home"); disegnaHome(); };
$("#nav-stat").onclick = () => { disegnaStat(); mostra("v-stat"); };
$$("[data-back]").forEach(b => b.onclick = () => { mostra(vistaPrec === "v-stat" ? "v-home" : vistaPrec); disegnaHome(); });

function confermaAbbandono() {
  if (!sessione || $("#v-quiz").hidden) return true;
  if (confirm("Vuoi uscire dalla prova? Resta salvata e potrai riprenderla dalla home.")) { fermaTimer(); return true; }
  return false;
}

// ---------- HOME ----------
function disegnaHome() {
  const box = $("#home-riepilogo");
  const storico = leggi(CHIAVI.storico, []);
  const errori = leggi(CHIAVI.errori, {});
  const daRipassare = Object.values(errori).filter(e => e.ok2 < 2).length;
  let html = "";

  const inCorso = leggi(CHIAVI.sessione, null);
  if (inCorso && inCorso.risposte.some(r => r !== null) && !inCorso.finita) {
    html += `<div class="avviso"><b>Hai una prova lasciata a metà</b><br>
      ${esc(inCorso.titolo)} — ${inCorso.risposte.filter(r => r !== null).length}/${inCorso.domande.length} risposte
      <br><button class="ghost" id="riprendi">Riprendi</button>
      <button class="ghost" id="scarta">Scarta</button></div>`;
  }

  const ultime = storico.slice(-5).reverse();
  html += `<div class="box"><h2>A che punto sei</h2><div class="mini">
      <div><b>${storico.length}</b><span>prove svolte</span></div>
      <div><b>${storico.length ? Math.round(storico.reduce((s, p) => s + p.percentuale, 0) / storico.length) : 0}%</b><span>media di risposte esatte</span></div>
      <div><b>${daRipassare}</b><span>domande da ripassare</span></div>
    </div>`;
  if (ultime.length) {
    html += `<table class="tabella" style="margin-top:16px"><thead><tr><th>Quando</th><th>Prova</th><th>Esatte</th><th>Punti</th></tr></thead><tbody>` +
      ultime.map(p => `<tr><td>${dataIt(p.quando)}</td><td>${esc(p.titolo)}</td><td>${p.corrette}/${p.totale} (${p.percentuale}%)</td><td>${p.punti}</td></tr>`).join("") +
      `</tbody></table>`;
  }
  html += `</div>`;
  box.innerHTML = html;

  const r = $("#riprendi"), s = $("#scarta");
  if (r) r.onclick = () => riprendi(inCorso);
  if (s) s.onclick = () => { localStorage.removeItem(CHIAVI.sessione); disegnaHome(); };
}

$$(".card").forEach(c => c.onclick = () => apriSetup(c.dataset.modalita));

// ---------- SETUP ----------
let modalitaSetup = "esame";

function apriSetup(modalita) {
  modalitaSetup = modalita;
  if (!BANCHE.length) { alert("Nessuna banca dati caricata: controlla il file domande/banche.js"); return; }
  $("#setup-titolo").textContent =
    modalita === "esame" ? "Simulazione d'esame" : modalita === "allenamento" ? "Allenamento per materia" : "Ripasso degli errori";
  $("#c-tempo").hidden = modalita !== "esame";
  $("#f-banca").innerHTML = BANCHE.map(b => `<option value="${esc(b.id)}">${esc(b.titolo)}</option>`).join("");
  $("#f-banca").onchange = aggiornaSetup;
  aggiornaSetup();
  $("#f-errore").hidden = true;
  mostra("v-setup");
}

function materieSelezionate() {
  return $$("#f-materie .chip[aria-pressed=true]").map(c => c.dataset.materia);
}

function aggiornaSetup() {
  const banca = bancaDi($("#f-banca").value);
  const conf = confDi(banca);
  $("#f-banca-hint").textContent = `${banca.domande.length} domande disponibili${banca.descrizione ? " — " + banca.descrizione : ""}`;

  const materie = [...new Set(domandeDi(banca).map(q => q.materia))];
  $("#c-materie").hidden = materie.length < 2;
  $("#f-materie").innerHTML = materie.map(m =>
    `<button type="button" class="chip" aria-pressed="true" data-materia="${esc(m)}">${esc(m)}</button>`).join("");
  $$("#f-materie .chip").forEach(ch => ch.onclick = () => {
    const attivo = ch.getAttribute("aria-pressed") === "true";
    if (attivo && materieSelezionate().length === 1) return; // almeno una
    ch.setAttribute("aria-pressed", String(!attivo));
    aggiornaMax();
  });

  $("#f-tempo").value = conf.durataMinuti;
  $("#f-numero").value = modalitaSetup === "esame" ? conf.numeroDomande : Math.min(15, banca.domande.length);
  $("#f-punteggio").textContent = modalitaSetup === "esame"
    ? `Punteggio: risposta esatta ${segno(conf.puntiCorretta)}, errata ${segno(conf.puntiErrata)}, non data ${segno(conf.puntiOmessa)}` +
      (conf.sogliaSufficienza != null
        ? ` · soglia di superamento: ${conf.sogliaSufficienza} punti su ${conf.numeroDomande} domande`
        : "")
    : "In allenamento vedi subito la risposta corretta e la spiegazione.";
  aggiornaMax();
}

function disponibili() {
  const banca = bancaDi($("#f-banca").value);
  let qs = domandeDi(banca);
  const mat = materieSelezionate();
  if (mat.length) qs = qs.filter(q => mat.includes(q.materia));
  if (modalitaSetup === "errori") {
    const errori = leggi(CHIAVI.errori, {});
    qs = qs.filter(q => { const e = errori[chiave(q)]; return e && e.ko > 0 && e.ok2 < 2; });
  }
  return qs;
}

function aggiornaMax() {
  const n = disponibili().length;
  const campo = $("#f-numero");
  campo.max = Math.max(1, n);
  if (+campo.value > n) campo.value = Math.max(1, n);
  const err = $("#f-errore");
  if (n === 0) {
    err.hidden = false;
    err.textContent = modalitaSetup === "errori"
      ? "Nessuna domanda da ripassare: svolgi prima qualche prova (o hai già recuperato tutti gli errori)."
      : "Nessuna domanda per la selezione scelta.";
    $("#f-avvia").disabled = true;
  } else { err.hidden = true; $("#f-avvia").disabled = false; }
}

$("#f-avvia").onclick = () => {
  const banca = bancaDi($("#f-banca").value);
  const conf = confDi(banca);
  let qs = disponibili();
  if (!qs.length) return;
  if ($("#f-mesc-dom").checked) qs = mescola(qs);
  const n = Math.min(Math.max(1, parseInt($("#f-numero").value, 10) || qs.length), qs.length);
  qs = qs.slice(0, n);

  const mescolaOpz = $("#f-mesc-opz").checked;
  sessione = {
    modalita: modalitaSetup,
    banca: banca.id,
    titolo: `${banca.titolo} — ${modalitaSetup === "esame" ? "simulazione" : modalitaSetup === "allenamento" ? "allenamento" : "ripasso errori"}`,
    conf,
    durataMs: modalitaSetup === "esame" ? Math.max(1, parseInt($("#f-tempo").value, 10) || conf.durataMinuti) * 60000 : null,
    inizio: Date.now(),
    indice: 0,
    finita: false,
    segnate: [],
    risposte: new Array(qs.length).fill(null),
    domande: qs.map(q => {
      const ordine = mescolaOpz ? mescola(q.opzioni.map((_, i) => i)) : q.opzioni.map((_, i) => i);
      return { id: q.id, banca: q._banca, materia: q.materia, testo: q.testo, spiegazione: q.spiegazione || "", fonte: q.fonte || "",
               opzioni: ordine.map(i => q.opzioni[i]), corretta: ordine.indexOf(q.corretta) };
    })
  };
  avvia();
};

function avvia() {
  salvaSessione();
  mostra("v-quiz");
  disegnaDomanda();
  if (sessione.durataMs) avviaTimer();
}
function riprendi(s) {
  sessione = s;
  mostra("v-quiz");
  disegnaDomanda();
  if (sessione.durataMs) avviaTimer();
}
const salvaSessione = () => scrivi(CHIAVI.sessione, sessione);

// ---------- TIMER ----------
function scadenza() { return sessione.inizio + sessione.durataMs; }
function avviaTimer() {
  fermaTimer();
  const agg = () => {
    const restante = scadenza() - Date.now();
    const el = $("#q-timer");
    el.textContent = "⏱ " + mmss(restante);
    el.classList.toggle("rosso", restante < 60000);
    if (restante <= 0) { fermaTimer(); alert("Tempo scaduto: la prova viene corretta."); consegna(); }
  };
  agg();
  tick = setInterval(agg, 250);
}
function fermaTimer() { if (tick) { clearInterval(tick); tick = null; } }

// ---------- QUIZ ----------
function domandaCorrente() { return sessione.domande[sessione.indice]; }
const inAllenamento = () => sessione.modalita !== "esame";

function disegnaDomanda() {
  const q = domandaCorrente(), i = sessione.indice, tot = sessione.domande.length;
  const data = sessione.risposte[i];
  const rivelata = inAllenamento() && data !== null;

  $("#q-contatore").textContent = `Domanda ${i + 1} di ${tot}`;
  $("#q-materia").textContent = q.materia;
  $("#q-timer").style.display = sessione.durataMs ? "" : "none";
  $("#q-progress-fill").style.width = ((i + 1) / tot * 100) + "%";
  $("#q-testo").textContent = q.testo;
  $("#q-segna").classList.toggle("attivo", sessione.segnate.includes(i));

  $("#q-opzioni").innerHTML = q.opzioni.map((t, k) => {
    let cls = "opz";
    if (data === k) cls += rivelata ? (k === q.corretta ? " giusta" : " sbagliata") : " scelta";
    if (rivelata && k === q.corretta) cls += " giusta";
    return `<button class="${cls}" data-k="${k}" ${rivelata ? "disabled" : ""}>
        <span class="lettera">${LETTERE[k]}</span><span>${esc(t)}</span></button>`;
  }).join("");
  $$("#q-opzioni .opz").forEach(b => b.onclick = () => rispondi(+b.dataset.k));

  const fb = $("#q-feedback");
  if (rivelata) {
    const giusto = data === q.corretta;
    fb.hidden = false;
    fb.className = "feedback " + (giusto ? "ok" : "ko");
    fb.innerHTML = `<b>${giusto ? "✅ Risposta esatta" : "❌ Risposta errata — corretta: " + LETTERE[q.corretta]}</b>` +
      (q.spiegazione ? esc(q.spiegazione) : "") +
      (q.fonte ? `<span class="fonte">Fonte: ${esc(q.fonte)}</span>` : "");
  } else { fb.hidden = true; }

  $("#q-prec").disabled = i === 0;
  $("#q-succ").textContent = i === tot - 1 ? "Consegna e correggi" : "Successiva →";
  $("#q-pulisci").hidden = rivelata || data === null;
  disegnaMappa();
}

function rispondi(k) {
  const i = sessione.indice;
  if (inAllenamento() && sessione.risposte[i] !== null) return; // già rivelata
  sessione.risposte[i] = k;
  salvaSessione();
  if (inAllenamento()) registraEsito(sessione.domande[i], k === sessione.domande[i].corretta);
  disegnaDomanda();
}

$("#q-pulisci").onclick = () => { sessione.risposte[sessione.indice] = null; salvaSessione(); disegnaDomanda(); };
$("#q-prec").onclick = () => vaiA(sessione.indice - 1);
$("#q-succ").onclick = () => {
  if (sessione.indice === sessione.domande.length - 1) chiediConsegna();
  else vaiA(sessione.indice + 1);
};
$("#q-segna").onclick = () => {
  const i = sessione.indice, p = sessione.segnate.indexOf(i);
  if (p >= 0) sessione.segnate.splice(p, 1); else sessione.segnate.push(i);
  salvaSessione(); disegnaDomanda();
};
$("#q-consegna").onclick = chiediConsegna;

function vaiA(i) {
  if (i < 0 || i >= sessione.domande.length) return;
  sessione.indice = i; salvaSessione(); disegnaDomanda();
}

function disegnaMappa() {
  $("#q-mappa").innerHTML = sessione.domande.map((_, i) => {
    let c = "cella";
    if (sessione.risposte[i] !== null) c += " risposta";
    if (sessione.segnate.includes(i)) c += " segnata";
    if (i === sessione.indice) c += " corrente";
    return `<button class="${c}" data-i="${i}">${i + 1}</button>`;
  }).join("");
  $$("#q-mappa .cella").forEach(b => b.onclick = () => vaiA(+b.dataset.i));
}

function chiediConsegna() {
  const senza = sessione.risposte.filter(r => r === null).length;
  const msg = senza ? `Ci sono ancora ${senza} domande senza risposta. Consegnare comunque?` : "Consegnare la prova?";
  if (confirm(msg)) consegna();
}

// ---------- CORREZIONE ----------
function registraEsito(q, giusto) {
  const errori = leggi(CHIAVI.errori, {});
  const k = `${q.banca}::${q.id}`;
  const e = errori[k] || { ko: 0, ok2: 0, materia: q.materia, testo: q.testo };
  if (giusto) e.ok2 = (e.ok2 || 0) + 1;
  else { e.ko = (e.ko || 0) + 1; e.ok2 = 0; }
  e.ultima = Date.now(); e.materia = q.materia; e.testo = q.testo;
  errori[k] = e;
  scrivi(CHIAVI.errori, errori);
}

function consegna() {
  fermaTimer();
  const conf = sessione.conf;
  let corrette = 0, errate = 0, omesse = 0, punti = 0;
  const perMateria = {};

  sessione.domande.forEach((q, i) => {
    const data = sessione.risposte[i];
    const m = perMateria[q.materia] || (perMateria[q.materia] = { tot: 0, ok: 0 });
    m.tot++;
    if (data === null) { omesse++; punti += conf.puntiOmessa; }
    else if (data === q.corretta) { corrette++; m.ok++; punti += conf.puntiCorretta; }
    else { errate++; punti += conf.puntiErrata; }
    if (!inAllenamento()) registraEsito(q, data === q.corretta);
  });

  punti = arrotonda(punti);
  const totale = sessione.domande.length;
  const percentuale = Math.round(corrette / totale * 100);
  let soglia = null, proporzionata = false;
  if (sessione.modalita === "esame" && conf.sogliaSufficienza != null) {
    soglia = conf.sogliaSufficienza;
    if (conf.numeroDomande && totale !== conf.numeroDomande) {
      soglia = Math.round(soglia * totale / conf.numeroDomande * 10) / 10;
      proporzionata = true;
    }
  }
  ultimoEsito = { corrette, errate, omesse, punti, totale, percentuale, perMateria, soglia, proporzionata,
                  durata: Date.now() - sessione.inizio, sessione: sessione, conf };

  const storico = leggi(CHIAVI.storico, []);
  storico.push({ quando: Date.now(), titolo: sessione.titolo, banca: sessione.banca, modalita: sessione.modalita,
                 corrette, errate, omesse, punti, totale, percentuale, durata: ultimoEsito.durata });
  scrivi(CHIAVI.storico, storico.slice(-100));

  sessione.finita = true;
  localStorage.removeItem(CHIAVI.sessione);
  disegnaRisultati();
  mostra("v-risultati");
}

function disegnaRisultati() {
  const e = ultimoEsito;
  const soglia = e.soglia;
  const passato = soglia != null ? e.punti >= soglia : null;
  const nota = e.proporzionata ? ` — soglia riproporzionata a ${e.totale} domande` : "";

  $("#r-sintesi").innerHTML = `
    <div class="voto">${e.punti} <span style="font-size:1.1rem;color:var(--testo-tenue)">${plur(e.punti, "punto", "punti")}</span></div>
    ${passato === null ? "" : `<div class="esito ${passato ? "ok" : "ko"}">${passato
        ? `Prova superata: ${e.punti} punti su una soglia di ${soglia}${nota}`
        : `Sotto la soglia di ${soglia} punti${nota}`}</div>`}
    <div class="dati">
      <div><b>${e.corrette}</b>esatte</div>
      <div><b>${e.errate}</b>errate</div>
      <div><b>${e.omesse}</b>non date</div>
      <div><b>${e.percentuale}%</b>di esattezza</div>
      <div><b>${mmss(e.durata)}</b>tempo impiegato</div>
    </div>`;

  $("#r-materie").innerHTML = Object.entries(e.perMateria).sort((a, b) => a[1].ok / a[1].tot - b[1].ok / b[1].tot)
    .map(([m, d]) => {
      const p = Math.round(d.ok / d.tot * 100);
      const cls = p < 50 ? "basso" : p < 75 ? "medio" : "";
      return `<div class="barra"><div class="testa"><b>${esc(m)}</b><span>${d.ok}/${d.tot} · ${p}%</span></div>
        <div class="traccia"><div class="riemp ${cls}" style="width:${p}%"></div></div></div>`;
    }).join("");

  $("#r-dettaglio").hidden = true;
  $("#r-rivedi").textContent = "Rivedi le domande";
}

$("#r-rivedi").onclick = () => {
  const box = $("#r-dettaglio");
  if (!box.hidden) { box.hidden = true; $("#r-rivedi").textContent = "Rivedi le domande"; return; }
  const s = ultimoEsito.sessione;
  box.innerHTML = s.domande.map((q, i) => {
    const data = s.risposte[i];
    const stato = data === null ? "vuota" : data === q.corretta ? "" : "ko";
    return `<div class="rev ${stato}">
      <div class="num">Domanda ${i + 1} · ${esc(q.materia)} · ${data === null ? "non data" : data === q.corretta ? "esatta" : "errata"}</div>
      <p class="t">${esc(q.testo)}</p>
      <ul>${q.opzioni.map((t, k) => {
        const c = k === q.corretta ? "g" : (k === data ? "s" : "");
        return `<li class="${c}">${LETTERE[k]}. ${esc(t)}${k === data ? " ← la tua risposta" : ""}</li>`;
      }).join("")}</ul>
      ${q.spiegazione ? `<p class="sp">${esc(q.spiegazione)}</p>` : ""}
      ${q.fonte ? `<p class="sp">Fonte: ${esc(q.fonte)}</p>` : ""}
    </div>`;
  }).join("");
  box.hidden = false;
  $("#r-rivedi").textContent = "Nascondi le domande";
  box.scrollIntoView({ behavior: "smooth", block: "start" });
};

$("#r-ripeti").onclick = () => apriSetup(ultimoEsito.sessione.modalita);

// ---------- STATISTICHE ----------
function disegnaStat() {
  const storico = leggi(CHIAVI.storico, []);
  const errori = leggi(CHIAVI.errori, {});
  const corpo = $("#s-corpo");
  if (!storico.length && !Object.keys(errori).length) {
    corpo.innerHTML = `<div class="vuoto">Ancora nessun dato: svolgi una prova e qui troverai andamento e punti deboli.</div>`;
    return;
  }
  let html = `<h2>Andamento delle prove</h2>`;
  html += storico.length
    ? `<table class="tabella"><thead><tr><th>Quando</th><th>Prova</th><th>Esatte</th><th>Punti</th><th>Tempo</th></tr></thead><tbody>` +
      storico.slice().reverse().slice(0, 30).map(p =>
        `<tr><td>${dataIt(p.quando)}</td><td>${esc(p.titolo)}</td><td>${p.corrette}/${p.totale} (${p.percentuale}%)</td><td>${p.punti}</td><td>${mmss(p.durata)}</td></tr>`
      ).join("") + `</tbody></table>`
    : `<div class="vuoto">Nessuna prova completata.</div>`;

  const perMateria = {};
  Object.values(errori).forEach(e => {
    const m = perMateria[e.materia] || (perMateria[e.materia] = { ko: 0, aperte: 0 });
    m.ko += e.ko; if (e.ok2 < 2 && e.ko > 0) m.aperte++;
  });
  html += `<h2>Punti deboli per materia</h2>`;
  const righe = Object.entries(perMateria).filter(([, d]) => d.ko > 0).sort((a, b) => b[1].ko - a[1].ko);
  html += righe.length
    ? `<table class="tabella"><thead><tr><th>Materia</th><th>Errori totali</th><th>Ancora da recuperare</th></tr></thead><tbody>` +
      righe.map(([m, d]) => `<tr><td>${esc(m)}</td><td>${d.ko}</td><td>${d.aperte}</td></tr>`).join("") + `</tbody></table>`
    : `<div class="vuoto">Nessun errore registrato. 👏</div>`;

  const aperte = Object.entries(errori).filter(([, e]) => e.ko > 0 && e.ok2 < 2);
  html += `<h2>Domande da ripassare (${aperte.length})</h2>`;
  html += aperte.length
    ? `<table class="tabella"><thead><tr><th>Materia</th><th>Domanda</th><th>Errori</th></tr></thead><tbody>` +
      aperte.sort((a, b) => b[1].ko - a[1].ko).slice(0, 40).map(([, e]) =>
        `<tr><td>${esc(e.materia || "-")}</td><td>${esc((e.testo || "").slice(0, 110))}${(e.testo || "").length > 110 ? "…" : ""}</td><td>${e.ko}</td></tr>`
      ).join("") + `</tbody></table>`
    : `<div class="vuoto">Niente in sospeso.</div>`;
  corpo.innerHTML = html;
}

$("#s-reset").onclick = () => {
  if (!confirm("Cancellare storico, errori e prova in corso? L'operazione non è reversibile.")) return;
  [CHIAVI.storico, CHIAVI.errori, CHIAVI.sessione].forEach(k => localStorage.removeItem(k));
  disegnaStat(); disegnaHome();
};

// ---------- tastiera ----------
document.addEventListener("keydown", ev => {
  if ($("#v-quiz").hidden || !sessione) return;
  const t = ev.target.tagName;
  if (t === "INPUT" || t === "SELECT" || t === "TEXTAREA") return;
  const k = ev.key.toLowerCase();
  const idx = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "abcd".indexOf(k);
  if (idx >= 0 && idx < domandaCorrente().opzioni.length) { ev.preventDefault(); rispondi(idx); return; }
  if (ev.key === "ArrowRight" || ev.key === "Enter") { ev.preventDefault(); $("#q-succ").click(); }
  if (ev.key === "ArrowLeft") { ev.preventDefault(); if (sessione.indice > 0) vaiA(sessione.indice - 1); }
});

window.addEventListener("beforeunload", e => {
  if (sessione && !sessione.finita && !$("#v-quiz").hidden) { salvaSessione(); e.preventDefault(); e.returnValue = ""; }
});

// ---------- avvio ----------
disegnaHome();
mostra("v-home");
})();

</script>
</body>
</html>
