# Pubblica il sito di preparazione al test su GitHub Pages.
# La cartella test-ingresso/ diventa https://papasecco.github.io/test-ingresso/
# e alla radice viene generata una pagina di collegamento.
name: Pubblica il sito su GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "test-ingresso/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione alla volta; le esecuzioni in coda vengono sostituite.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # attiva Pages al primo passaggio, senza toccare le impostazioni

      - name: Prepara i file del sito
        run: |
          mkdir -p _site/test-ingresso
          cp -r test-ingresso/. _site/test-ingresso/
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="it">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>papasecco</title>
          <style>
            :root{color-scheme:light dark}
            body{margin:0;min-height:100vh;display:grid;place-items:center;
                 font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
                 background:#f6f5f1;color:#1a1c22;padding:24px;text-align:center}
            a{display:inline-block;margin-top:18px;background:#2b4bb8;color:#fff;text-decoration:none;
              padding:12px 20px;border-radius:10px;font-weight:600}
            p{color:#5b6070;max-width:42ch}
            @media (prefers-color-scheme:dark){
              body{background:#12141a;color:#e8eaf0} p{color:#99a0b0} a{background:#8aa5ff;color:#12141a}
            }
          </style>
          </head>
          <body>
            <main>
              <h1>Preparazione al test d'ingresso</h1>
              <p>Simulazioni, allenamento per materia e revisione degli errori per la prova di ammissione
                 alla magistrale in Comunicazione pubblica e d'impresa.</p>
              <a href="./test-ingresso/">Apri il sito</a>
            </main>
          </body>
          </html>
          HTML

      - name: Carica l'artefatto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pubblica
        id: deploy
        uses: actions/deploy-pages@v4
