# Pubblica il sito di preparazione al test su GitHub Pages.
# La cartella test-ingresso/ diventa https://papasecco.github.io/test-ingresso/
# e alla radice viene generata una pagina di collegamento.
name: Pubblica il sito su GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "test-ingresso/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione alla volta; le esecuzioni in coda vengono sostituite.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages va attivato una volta sola a mano, in Settings -> Pages,
      # scegliendo "GitHub Actions" come sorgente: il token del workflow ha i
      # permessi per pubblicare, non per creare il sito.
      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Prepara i file del sito
        run: |
          mkdir -p _site/test-ingresso
          # il sito risponde sia dalla radice sia da /test-ingresso/
          cp -r test-ingresso/. _site/
          cp -r test-ingresso/. _site/test-ingresso/
          touch _site/.nojekyll
          # Versiona i riferimenti a css e js con il commit pubblicato: senza
          # questo i browser continuano a usare la copia in cache dopo un
          # aggiornamento, e le correzioni non si vedono.
          for f in _site/index.html _site/test-ingresso/index.html; do
            sed -i "s|\"style.css\"|\"style.css?v=${GITHUB_SHA}\"|g; \
                    s|\"app.js\"|\"app.js?v=${GITHUB_SHA}\"|g; \
                    s|\"domande/banche.js\"|\"domande/banche.js?v=${GITHUB_SHA}\"|g" "$f"
          done
          grep -o 'v=[0-9a-f]\{7\}' _site/index.html | head -3
          # Copia in un solo file sotto /app/: un unico documento, senza css e
          # js separati che possano restare in cache sui telefoni.
          mkdir -p _site/app
          cp test-ingresso/dist/test-ingresso.html _site/app/index.html

      - name: Carica l'artefatto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pubblica
        id: deploy
        uses: actions/deploy-pages@v4
